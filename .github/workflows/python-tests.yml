name: Django Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # Valid pairs only, per https://docs.djangoproject.com/en/dev/faq/install/
        include:
          - { python-version: '3.10', django-version: '4.2.*' }
          - { python-version: '3.11', django-version: '4.2.*' }
          - { python-version: '3.12', django-version: '4.2.*' }

          - { python-version: '3.10', django-version: '5.0.*' }
          - { python-version: '3.11', django-version: '5.0.*' }
          - { python-version: '3.12', django-version: '5.0.*' }

          - { python-version: '3.10', django-version: '5.1.*' }
          - { python-version: '3.11', django-version: '5.1.*' }
          - { python-version: '3.12', django-version: '5.1.*' }
          - { python-version: '3.13', django-version: '5.1.*' }

          - { python-version: '3.10', django-version: '5.2.*' }
          - { python-version: '3.11', django-version: '5.2.*' }
          - { python-version: '3.12', django-version: '5.2.*' }
          - { python-version: '3.13', django-version: '5.2.*' }
          - { python-version: '3.14', django-version: '5.2.*' }

          - { python-version: '3.12', django-version: '6.0.*' }
          - { python-version: '3.13', django-version: '6.0.*' }
          - { python-version: '3.14', django-version: '6.0.*' }

          - { python-version: '3.12', django-version: '6.1.*' }
          - { python-version: '3.13', django-version: '6.1.*' }
          - { python-version: '3.14', django-version: '6.1.*' }

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: Run tests
      run: |
        python -m pip install --upgrade pip
        pip install "Django==${{ matrix.django-version }}"
        pip install -e .[elasticsearch]
        python -m unittest discover

  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - uses: actions/setup-python@v7
      with:
        python-version: '3.14'

    - name: Install linters
      run: pip install black==26.10.1 isort==9.0.2

    - name: Check code style with black
      run: black --check .

    - name: Check import order with isort
      run: isort --check-only .
